name: CI

on:
  pull_request:
    branches:
      - stable
      - develop

env:
  BUN_CACHE_KEY: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}

permissions:
  contents: write
  id-token: write

jobs:
  check-changesets:
    name: Check for changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/changed-files.txt

          if grep -q "^src/" /tmp/changed-files.txt; then
            if ! ls .changeset/*.md 2>/dev/null | grep -v "README.md" 2>/dev/null | head -1 | grep -q .; then
              echo "Error: Changes to src/ detected, but no changeset found."
              echo ""
              echo "Please add a changeset to document your changes:"
              echo "  bunx changeset"
              echo ""
              exit 1
            fi
          fi

  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ env.BUN_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
